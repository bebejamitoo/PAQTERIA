services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paqteria-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "11433:1433"
    volumes:
      - paqteria-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  paqteria-api:
    build:
      context: .
      dockerfile: PAQTERIA.Server/Dockerfile
    container_name: paqteria-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=PAQTERIA;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
    ports:
      - "5272:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - paqteria-api-keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  paqteria-sql-data:
  paqteria-api-keys:
